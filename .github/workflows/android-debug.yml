name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  push:
    tags:
      - "v*"

# Note: duplicate push keys are invalid YAML — use a single push with branches+tags
# Corrected trigger block below replaces the above if needed.

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; else
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tah-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/tah-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/tah-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
