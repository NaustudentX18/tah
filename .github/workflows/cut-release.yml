name: Cut tagged release

on:
  push:
    paths:
      - ".release-request"

jobs:
  release:
    name: assembleDebug + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tag name
        id: tag
        run: |
          TAG=$(tr -d '[:space:]' < .release-request)
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cutting release tag: $TAG @ $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/tah-${{ steps.tag.outputs.name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: TAH ${{ steps.tag.outputs.name }}
          body: |
            TAH ${{ steps.tag.outputs.name }} sideload build.

            - applicationId: `app.tah.shell`
            - Debug APK attached (install via `adb install -r`)
            - Ship gate: board + approvals + tool cards
          files: release-assets/tah-${{ steps.tag.outputs.name }}.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
